<div class="container py-4" style="max-width: 1200px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header" style="background-color: #2c3e50; color: white;">
      <h2 class="h5 mb-0 text-center">Policy Management</h2> 
    </div>
    
    <div class="card-body p-3">
      <div class="row mb-3"> 
        <div class="col-md-6">
          <div class="input-group">
            <input type="text" class="form-control form-control-sm" 
                [(ngModel)]="searchTerm" 
                (keyup.enter)="onSearch()" 
                placeholder="Search policies...">
            <button class="btn btn-sm" (click)="onSearch()" style="background-color: #2c3e50; color: white;">
              <i class="bi bi-search"></i> Search
            </button>
          </div>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-success btn-sm" (click)="addNewPolicy()">
                <i class="bi bi-plus-circle"></i> Add new policy
            </button>
        </div>
        <div *ngIf="showSavedForm" class="modal-overlay">
                    <app-policy-add-form
                     *ngIf="selectedPolicy"
                    [policy]="selectedPolicy"
                    (save)="handleSave($event)"
                    (cancel)="handleCancel()">
                    </app-policy-add-form>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-sm table-hover mb-0">
        <thead style="background-color: #2c3e50; color: white;">
            <tr>
            <th scope="col" class="text-center">Policy name</th>
            <th scope="col" class="text-center">Policy type</th>
            <th scope="col" class="text-center">Policy price</th>
            <th scope="col" class="text-center">Policy description</th>
            <th scope="col" class="text-center">Actions</th>
            </tr>
        </thead>
          <tbody>
            <tr *ngFor="let policy of displayedPolicies">
              <td class="text-center">{{ policy.policyname }}</td>
              <td class="text-center">{{ policy.type }}</td>
              <td class="text-center">{{ policy.price }}</td>
              <td class="text-center description-container">
                {{ (policy.description.length > 50) ? (policy.description | slice:0:50) + '...' : policy.description }}
                <div *ngIf="selectedPolicy === policy && showDescriptionPopup" 
                    class="description-popup">
                  {{ policy.description }}
                  <div class="text-end mt-2">
                    <button class="btn btn-sm btn-outline-secondary" 
                            (click)="closeDescriptionPopup()">
                      Close
                    </button>
                  </div>
                </div>
              </td>
              <td class="text-center">
                <div class="d-flex gap-2 justify-content-center">
                  <button class="btn btn-sm px-2 flex-grow-0" 
                          style="background-color: #2c3e50; color: white;"
                          (click)="showDescription(policy)">
                    Details
                  </button>
                </div>
              </td>
                                
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
