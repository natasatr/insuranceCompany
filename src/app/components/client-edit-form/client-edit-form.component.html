<div class="update-form-container" style="max-width: 800px; margin: 0 auto;">
    <div class="card border-0 shadow-sm">
        <div class="card-header" style="background-color: #2c3e50; color: white;">
            <h2 class="h5 mb-0 text-center">Update Client</h2>
        </div>
        
        <div class="card-body p-4 form-content">
            <form #updateForm="ngForm" (ngSubmit)="onSubmit(updateForm)">
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Username</label>
                    <div class="col-md-7">
                        <input type="text" class="form-control" 
                            [(ngModel)]="client.username" name="username" required
                            value="zorical18">
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">First Name</label>
                    <div class="col-md-7">
                        <input type="text" class="form-control" 
                            [(ngModel)]="client.firstName" name="firstName" required
                            value="Milica">
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Last Name</label>
                    <div class="col-md-7">
                        <input type="text" class="form-control" 
                            [(ngModel)]="client.lastName" name="lastName" required
                            value="Markovic">
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Email</label>
                    <div class="col-md-7">
                        <input type="email" class="form-control" 
                            [(ngModel)]="client.email" name="email"
                            value="instrukcijeinstrukcije@gmail.com">
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">New Password</label>
                    <div class="col-md-7">
                        <input type="password" class="form-control" 
                            [(ngModel)]="newPassword" name="newPassword"
                            placeholder="Leave blank to keep current">
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Repeat Password</label>
                    <div class="col-md-7">
                        <input type="password" class="form-control" 
                            [(ngModel)]="repeatPassword" name="repeatPassword">
                    </div>
                </div>
                
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="button" class="btn px-4" 
                            style="background-color: #2c3e50; color: white;"
                            (click)="onCancel()">
                        Cancel
                    </button>
                    <button type="submit" class="btn px-4" 
                            style="background-color: #2c3e50; color: white;"
                            [disabled]="updateForm.invalid">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
