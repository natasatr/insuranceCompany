<div class="container py-4" style="max-width: 1200px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header" style="background-color: #2c3e50; color: white;">
      <h2 class="h5 mb-0 text-center">View my policies</h2> 
    </div>
  
    <div class="card-body p-3">
      <div class="row mb-3"> 
        <div class="col-md-6">
          <div class="input-group">
            <input type="text" class="form-control form-control-sm" 
                [(ngModel)]="searchTerm" 
                (keyup.enter)="onSearch()" 
                placeholder="Search policies...">
            <button class="btn btn-sm" (click)="onSearch()" style="background-color: #2c3e50; color: white;">
              <i class="bi bi-search"></i> Search
            </button>
          </div>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table table-sm table-hover mb-0">
        <thead style="background-color: #2c3e50; color: white;">
            <tr>
            <th scope="col" class="text-center">Policy name</th>
            <th scope="col" class="text-center">Policy type</th>
            <th scope="col" class="text-center">Policy price</th>
            <th scope="col" class="text-center">Policy description</th>
            </tr>
        </thead>
          <tbody>
            <tr *ngFor="let policy of displayedPolicies">
          
              <td class="text-center">{{ policy.policy.policyname }}</td>
              <td class="text-center">{{ policy.policy.type }}</td>
              <td class="text-center">{{ policy.policy.policyname }}</td>
              <td class="text-center">{{ (policy.policy.description.length > 50) ? (policy.policy.description | slice:0:50) + '...' : policy.policy.description }}</td>
              <td class="text-center">
                <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-sm px-2 flex-grow-0"
                        style="background-color: #db541e; color: white;"
                        (click)="deletePolicy(policy.policy)">
                        Delete
                </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      <!-- <app-policy-purchase
        *ngIf="showPurchaseModal && purchasePolicy"
            [policy.]="purchasePolicy"
            (confirm)="handlePurchaseConfirm()"
            (cancel)="handlePurchaseCancel()">
</app-policy-purchase>-->
      </div>
    </div>
  </div>
</div>
