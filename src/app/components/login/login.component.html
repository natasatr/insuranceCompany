<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px">
        <div class="card-body">
            <h2 class="card-title text-center">Login</h2>
            <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" [(ngModel)]="credentials.username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" [(ngModel)]="credentials.password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.valid">Login</button>
                <p class="text-center mt-3">
                    Don't have an account? <a routerLink="/register">Register here</a>
                </p>

            </form>

        </div>
    </div>
</div>
