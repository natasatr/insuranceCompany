<div class="update-form-container" style="width: 800px; margin: 0 auto;">
    <div class="card border-0 shadow-sm">
        <div class="card-header" style="background-color: #2c3e50; color: white;">
            <h2 class="h5 mb-0 text-center">Add new policy</h2>
        </div>
        
        <div class="card-body p-4 form-content">
            <form #saveForm="ngForm" (ngSubmit)="onSubmit(saveForm)">
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Name:</label>
                    <div class="col-md-7">
                        <input type="text" class="form-control" 
                            [(ngModel)]="policy.policyname" name="policyname" required>
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Type:</label>
                    <div class="col-md-7">
                        <input type="text" class="form-control" 
                            [(ngModel)]="policy.type" name="type" required>
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Price:</label>
                    <div class="col-md-7">
                        <input type="number" class="form-control" 
                            [(ngModel)]="policy.price" name="price" required
                            value="0">
                    </div>
                </div>
                
                <div class="mb-4 row align-items-center">
                    <label class="col-md-3 col-form-label">Description:</label>
                    <div class="col-md-9">
                        <textarea class="form-control" rows="4"
                            [(ngModel)]="policy.description" name="description" required></textarea>
                    </div>
                </div>
                
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="button" class="btn px-4" 
                            style="background-color: #2c3e50; color: white;"
                            (click)="onCancel()">
                        Cancel
                    </button>
                    <button type="submit" class="btn px-4" 
                            style="background-color: #2c3e50; color: white;"
                            [disabled]="saveForm.invalid">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
