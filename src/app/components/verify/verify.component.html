<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h2 class="card-title text-center">Please, verify your email</h2>
            
            <div *ngIf="isBlocked" class="alert alert-danger">
                <h4>Account Blocked</h4>
                <p>Your account has been blocked due to multiple failed verification attempts.</p>
                <p>Please contact the administrator to unblock your account.</p>
                <hr>
                    <p class="mb-0">Return to <a routerLink="/login" class="alert-link">Login page</a></p>
            </div>

            <form *ngIf="!isBlocked" #verifyForm="ngForm" (ngSubmit)="onVerify(verifyForm)">
                <div class="mb-3">
                    <label for="code" class="form-label">Verification code</label>
                    <input type="text" class="form-control" id="code" name="code" 
                        [(ngModel)]="verifyData.code" required>
                </div>
                <button type="submit" class="btn btn-success w-100" 
                        [disabled]="!verifyForm.valid">Verify</button>
                <p class="text-center mt-3">Back to <a routerLink="/login">Login page</a></p>
            </form>
            
            <div *ngIf="error && !isBlocked" class="alert alert-danger mt-3">
                {{error}}
            </div>
        </div>
    </div>
</div>
